{{ partial "header.html" . }}

<div class="container">
    <article class="note-container terminal-window" itemscope="" itemtype="https://schema.org/BlogPosting">
        <div class="terminal-toolbar" aria-hidden="true">
            <span class="terminal-dot terminal-dot-red"></span>
            <span class="terminal-dot terminal-dot-amber"></span>
            <span class="terminal-dot terminal-dot-green"></span>
            <span class="terminal-window-title">~/notes/{{ .File.BaseFileName }}.md</span>
        </div>
        <div class="note-document">
            {{ partial "note-header.html" . }}
            {{ partial "note-content.html" . }}
            {{ partial "note-footer.html" . }}
        </div>
    </article>
</div>

{{ partial "footer.html" . }}
